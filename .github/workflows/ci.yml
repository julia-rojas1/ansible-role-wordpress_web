name: Molecule CI & Galaxy Release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Molecule Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias del proyecto
        run: poetry install

      - name: Instalar colecciones requeridas de Ansible
        run: poetry run ansible-galaxy collection install ansible.posix

      - name: 1. Ejecutar Ansible Lint
        run: poetry run ansible-lint

      - name: 2. Ejecutar Molecule Test (Ubuntu & Rocky)
        run: poetry run molecule test

  release:
    name: Publicar en Ansible Galaxy
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ansible-core
        run: pip install ansible-core

      - name: Importar rol a Ansible Galaxy
        run: >
          ansible-galaxy role import
          --token ${{ secrets.GALAXY_API_KEY }}
          ${{ github.repository_owner }}
          ${{ github.event.repository.name }}
